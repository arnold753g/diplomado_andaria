limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=120r/m;

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;
    limit_req_status 429;
    include /etc/nginx/trusted-proxies.conf;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # TLS terminates at the outer proxy. Browsers ignore HSTS over plain HTTP.
    # Start with five minutes; increase only after validating TLS renewal.
    add_header Strict-Transport-Security "max-age=300" always;
    # HTML CSP belongs to Nuxt (per-response nonce); API CSP belongs to Go.

    location = /health {
        access_log off;
        proxy_pass http://backend:8080/health;
    }

    # OAuth codes must not appear in access logs.
    location = /api/v1/auth/google/callback {
        access_log off;
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Attraction and package galleries contain up to six base64 images of 5 MB each.
    location ~ ^/api/v1/(admin/attractions|managed-attractions|agency/packages)(/|$) {
        client_max_body_size 42m;
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # A 5 MiB image grows to about 6.7 MiB when transported as base64 JSON.
    location ~ ^/api/v1/(me/purchases|agency/purchases)(/|$) {
        client_max_body_size 8m;
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

