name: Andaria quality

on:
  push:
    paths: ['mobile/**', 'backend/**', 'frontend/**', '.github/workflows/quality.yml']
  pull_request:
    paths: ['mobile/**', 'backend/**', 'frontend/**', '.github/workflows/quality.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the project's Flutter SDK
        run: |
          git clone --depth 1 --branch 3.44.8 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - name: Accept Android SDK licenses
        run: |
          set +o pipefail
          yes | flutter doctor --android-licenses
      - name: Compile Android for tests
        run: flutter build apk --debug --no-pub

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: andaria_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d andaria_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_DSN: host=localhost port=5432 user=postgres password=ci-only-password dbname=andaria_ci sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.12'
          cache-dependency-path: backend/go.sum
      - run: go vet ./...
      - run: go test ./... -count=1

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
