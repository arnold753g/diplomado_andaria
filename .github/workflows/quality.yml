name: Andaria quality

on:
  push:
    paths: ['mobile/**', 'backend/**', 'frontend/**', 'tools/security/**', 'backend/scripts/**', 'nginx/**', 'docker-compose*.yml', '.github/workflows/quality.yml']
  pull_request:
    paths: ['mobile/**', 'backend/**', 'frontend/**', 'tools/security/**', 'backend/scripts/**', 'nginx/**', 'docker-compose*.yml', '.github/workflows/quality.yml']
  workflow_dispatch:
  schedule:
    - cron: '37 9 * * 1'

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the project's Flutter SDK
        run: |
          git clone --depth 1 --branch 3.44.8 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - name: Accept Android SDK licenses
        run: |
          set +o pipefail
          yes | flutter doctor --android-licenses
      - name: Compile Android for tests
        run: flutter build apk --debug --no-pub
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - name: Install the pinned OSV scanner
        run: go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.7.0
      - name: Inventory Android runtime dependencies
        working-directory: mobile/android
        run: ./gradlew --no-daemon -I security-sbom.gradle andariaSecuritySbom
      - name: Scan Dart and Android runtime dependencies
        run: osv-scanner scan source --lockfile=pubspec.lock --sbom=build/security/android.cdx.json

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: andaria_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d andaria_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_DSN: host=localhost port=5432 user=postgres password=ci-only-password dbname=andaria_ci sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache-dependency-path: backend/go.sum
      - run: go vet ./...
      - run: go test ./... -count=1
      - name: Bootstrap a fresh DB and start the production API with a limited role
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: ci-only-password
          PGDATABASE: andaria_ci
        run: |
          export ANDARIA_DB_RUNTIME_PASSWORD=$(openssl rand -hex 32)
          export ANDARIA_DB_MIGRATION_PASSWORD=$(openssl rand -hex 32)
          psql -X --set=ON_ERROR_STOP=1 --file=scripts/database-roles.sql
          export APP_ENV=production DB_HOST=localhost DB_PORT=5432 DB_NAME=andaria_ci
          export SESSION_SECRET=$(openssl rand -hex 32)
          export ALLOWED_ORIGINS=https://ci.andaria.test DB_AUTO_MIGRATE=false
          export DB_USER=andaria_migrator DB_PASSWORD="$ANDARIA_DB_MIGRATION_PASSWORD"
          go run ./cmd/migrate
          export DB_USER=andaria_api DB_PASSWORD="$ANDARIA_DB_RUNTIME_PASSWORD"
          if PGPASSWORD="$DB_PASSWORD" psql -U andaria_api -c "UPDATE migraciones_esquema SET nombre='forbidden'" >/dev/null 2>&1; then
            echo 'Runtime role can write the migration ledger'
            exit 1
          fi
          go build -o "$RUNNER_TEMP/andaria-api" ./cmd/api
          SERVER_HOST=127.0.0.1 SERVER_PORT=18880 "$RUNNER_TEMP/andaria-api" > "$RUNNER_TEMP/api-bootstrap.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18880/health >/dev/null; then ready=true; break; fi
            sleep 1
          done
          "$ready"

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: python3 -m unittest discover -s ../tools/security -p 'test_*.py'
      - run: npm run typecheck
