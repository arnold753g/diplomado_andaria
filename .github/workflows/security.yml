name: Andaria security

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '27 9 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - run: gitleaks git --redact=100 --config .gitleaks.toml --log-opts="--all"

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache-dependency-path: backend/go.sum
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - run: govulncheck ./...
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: '0'

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: python3 tools/security/check_npm.py

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: docker build -t andaria-security:${{ matrix.component }} ${{ matrix.component }}
      - name: Scan the final runtime image
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.76.1 image --scanners vuln --severity HIGH,CRITICAL
          --exit-code 1 andaria-security:${{ matrix.component }}

  infrastructure-images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        image: ['postgres:16-alpine', 'nginx:1.30.6-alpine']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Scan infrastructure images
        run: >-
          docker run --rm aquasec/trivy:0.76.1 image --scanners vuln
          --severity HIGH,CRITICAL --exit-code 1 ${{ matrix.image }}
      - name: Validate Nginx syntax with the deployed include files
        if: startsWith(matrix.image, 'nginx:')
        run: >-
          docker run --rm --add-host backend:127.0.0.1 --add-host frontend:127.0.0.1
          -v "$PWD/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"
          -v "$PWD/nginx/trusted-proxies.conf:/etc/nginx/trusted-proxies.conf:ro"
          ${{ matrix.image }} nginx -t
