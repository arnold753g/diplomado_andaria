// CI init script: inventory resolved Android runtime modules, not just Dart.
import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier

gradle.projectsEvaluated {
    rootProject.tasks.register('andariaSecuritySbom') {
        doLast {
            def app = rootProject.project(':app')
            def modules = app.configurations.getByName('releaseRuntimeClasspath')
                .incoming.resolutionResult.allComponents.collect { it.id }
                .findAll { it instanceof ModuleComponentIdentifier }
                .collect { [group: it.group, name: it.module, version: it.version] }
                .unique().sort { a, b -> "${a.group}:${a.name}" <=> "${b.group}:${b.name}" }
            def components = modules.collect { m ->
                def encode = { value -> URLEncoder.encode(value, 'UTF-8').replace('+', '%20') }
                [type: 'library', group: m.group, name: m.name, version: m.version,
                 purl: "pkg:maven/${encode(m.group)}/${encode(m.name)}@${encode(m.version)}"]
            }
            if (components.isEmpty()) throw new GradleException('Android dependency inventory is empty')
            def output = new File(rootProject.projectDir, '../build/security/android.cdx.json')
            output.parentFile.mkdirs()
            output.text = JsonOutput.prettyPrint(JsonOutput.toJson([
                bomFormat: 'CycloneDX', specVersion: '1.5', version: 1, components: components
            ]))
            println "Android SBOM: ${components.size()} runtime modules"
        }
    }
}
