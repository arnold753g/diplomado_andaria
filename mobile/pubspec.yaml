name: andaria_mobile
description: App Android de Andaria para turistas.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  provider: ^6.1.5+1
  intl: ^0.20.2
  image_picker: ^1.2.4
  url_launcher: ^6.3.3
  share_plus: ^13.3.1
  uuid: ^4.6.0
  google_sign_in: ^7.2.0
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  http_mock_adapter: ^0.6.1
  integration_test:
    sdk: flutter
  image_picker_platform_interface: ^2.11.2
  url_launcher_platform_interface: 2.3.2


flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit.ttf
